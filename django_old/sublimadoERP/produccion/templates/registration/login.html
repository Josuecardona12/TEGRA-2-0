<!DOCTYPE html>
<html>
<head>
    <title>Login ERP</title>

    <style>
        body{
            background:#f4f6f9;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:white;
            padding:30px;
            border-radius:10px;
            width:300px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            background:#714B67;
            color:white;
            border:none;
            cursor:pointer;
        }
    </style>

</head>
<body>

<div class="login-box">

    <h2>ERP Login</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Entrar</button>
    </form>

</div>

</body>
</html>
