{% extends "base.html" %}

{% block contenido %}

<h1>Órdenes de Producción</h1>

<a href="{% url 'crear_orden' %}" class="btn azul">
    + Nueva Orden
</a>

<br><br>

<table>
    <tr>
        <th>ID</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>

    {% for orden in ordenes %}
    <tr>
        <td>{{ orden.id }}</td>
        <td>{{ orden.producto }}</td>
        <td>{{ orden.cantidad }}</td>
        <td>{{ orden.estado }}</td>

        <td>
            <a href="{% url 'editar_orden' orden.id %}" class="btn verde">Editar</a>
            <a href="{% url 'eliminar_orden' orden.id %}" class="btn rojo">Eliminar</a>
        </td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
