<!DOCTYPE html>
<html>
<head>
    <title>Dashboard ERP</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        .card {
            display: inline-block;
            width: 200px;
            padding: 20px;
            margin: 10px;
            color: white;
            font-size: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .total { background: #333; }
        .pendiente { background: orange; }
        .proceso { background: blue; }
        .terminado { background: green; }

        canvas {
            background: white;
            padding: 20px;
            margin-top: 30px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>📊 Dashboard Producción</h1>

<div class="card total">
    Total Órdenes<br>
    {{ total }}
</div>

<div class="card pendiente">
    Pendientes<br>
    {{ pendientes }}
</div>

<div class="card proceso">
    En Proceso<br>
    {{ proceso }}
</div>

<div class="card terminado">
    Terminadas<br>
    {{ terminado }}
</div>

<canvas id="graficaEstados"></canvas>

<script>
    const ctx = document.getElementById('graficaEstados');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Pendiente', 'Proceso', 'Terminado'],
            datasets: [{
                label: 'Órdenes',
                data: [{{ pendientes }}, {{ proceso }}, {{ terminado }}]
            }]
        }
    });
</script>

<br><br>

<a href="/ordenes/">📋 Ver Órdenes</a>

</body>
</html>
